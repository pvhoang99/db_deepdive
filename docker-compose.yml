services:
  pg:
    image: postgres:17
    container_name: pgdd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab
      # tắt jit để plan/timing ổn định, dễ so sánh giữa các lần chạy
      PGOPTIONS: "-c jit=off"
    ports:
      - "5433:5432"
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed:/seed
      - ./days:/days
    command:
      - postgres
      # --- bắt buộc cho lab ---
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_functions=all
      # --- cố tình để NHỎ: để bạn nhìn thấy spill to disk, external sort, bitmap scan ---
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=100
      # --- quan sát ---
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - jit=off

volumes:
  pgdata:
